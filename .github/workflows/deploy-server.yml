# Deploys the card server to Fly on every push to main, which the `main` ruleset only allows after
# `ci-required` passes on the PR. This runs in a separate workflow so that a failed deploy never
# touches `ci-required`. Setup and failure recovery are in NOTES.md.
name: Deploy server

on:
  push:
    branches: [main]
  # The redeploy after a failure. The environment below refuses any ref but main.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, so two queued merges can't release in the wrong order. No cancel-in-progress:
# the running deploy finishes, then only the newest waiting run goes, and it contains every merge
# before it.
concurrency:
  group: deploy-server

jobs:
  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The token lives in this environment, which only `main` can use. That policy is what stops a
    # workflow edited on a branch from reading it.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.114
      # --ha=false keeps one machine, because the rate limiters are in memory (see NOTES.md).
      # The label puts the commit in the image name, which is how `fly releases --image` shows it.
      - run: flyctl deploy --remote-only --ha=false --image-label "deployment-${GITHUB_SHA}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # --ha=false doesn't shrink an app that already has two machines, so catch that here. The
      # count includes stopped machines.
      - name: Check for one machine and a healthy server
        # Named so bash adds pipefail: a flyctl failure must not read as a machine count.
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          machines="$(flyctl machine list --app fencepost --json | jq length)"
          if [ "$machines" != "1" ]; then
            echo "::error::Expected 1 machine, found $machines. Run fly scale count 1 (see NOTES.md)."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 --retry 5 --retry-all-errors --retry-delay 5 \
            https://fencepost.fly.dev/api/health
