# Runs on every push to main, which the `main` ruleset only allows after `ci-required` passes on the
# PR. A native change gets a new TestFlight build; anything else ships as an over-the-air update to
# the builds with the same fingerprint. Setup and failure recovery are in NOTES.md.
name: Deploy iOS

on:
  push:
    branches: ['main']

# One deploy at a time, or two queued merges could publish their updates in the wrong order and
# leave older code live. No cancel_in_progress: the running deploy finishes, then only the newest
# waiting run goes, and it contains every merge before it.
concurrency:
  group: deploy-ios-${{ github.ref }}

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production
  get_ios_build:
    name: Check for an iOS build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      # A build started by hand counts too, so wait for it rather than starting a second one.
      wait_for_in_progress: true
  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production
  testflight_ios:
    name: Upload to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
  update_ios:
    name: Publish iOS update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: ios
